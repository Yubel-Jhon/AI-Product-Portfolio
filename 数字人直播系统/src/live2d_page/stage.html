<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>直播页 · 动漫数字人</title>
    <style>
      html, body {
        margin: 0; width: 100%; height: 100%;
        background: #000; overflow: hidden;
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      #stage { display: block; width: 100vw; height: 100vh; }
      #hud { position: fixed; left: 0; bottom: 8vh; width: 100%; text-align: center; pointer-events: none; }
      #subtitle {
        color: #fff; font-size: 28px; text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        background: rgba(0,0,0,0.45); display: inline-block; padding: 8px 24px; border-radius: 20px;
      }
      #emotion { color: #ffd54f; font-size: 16px; margin-top: 6px; opacity: 0.85; }
      #status { position: fixed; top: 12px; left: 12px; color: #0f0; font-size: 13px; font-family: monospace; }
      #chatbar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: none; gap: 8px; z-index: 20; align-items: center; }
      #chatbar.show { display: flex; }
      #chat-input {
        width: 320px; padding: 10px 14px; font-size: 15px; border: 1px solid #ffd54f;
        border-radius: 24px; background: rgba(0,0,0,0.6); color: #fff; outline: none;
      }
      #chat-send { padding: 10px 20px; font-size: 15px; color: #000; background: #ffd54f; border: none; border-radius: 24px; cursor: pointer; }
      #boot-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.3);
        display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10;
      }
      #boot-overlay .btn {
        color: #fff; font-size: 24px; letter-spacing: 2px; padding: 14px 44px;
        border: 2px solid #ffd54f; border-radius: 40px; background: rgba(0,0,0,0.55); user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="hud"><div id="subtitle">正在加载…</div><div id="emotion"></div></div>
    <div id="status">booting…</div>
    <div id="boot-overlay" style="display:none"><div class="btn">▶ 点击开始直播</div></div>
    <div id="chatbar">
      <input id="chat-input" type="text" placeholder="输入内容，回车发送…" />
      <button id="chat-send">发送</button>
    </div>
    <div id="fatal" style="display:none; position:fixed; inset:0; background:#200; color:#ff6b6b; font-size:18px; padding:24px; z-index:99; white-space:pre-wrap; font-family:monospace;"></div>

    <!-- Live2D Cubism Core（官方运行时，live2d 模特用；puppet 用不到但先载着无妨） -->
    <script src="/Core/live2dcubismcore.min.js"></script>

    <script type="module">
      window.addEventListener('error', e => { const el = document.getElementById('fatal'); if (el) { el.style.display='block'; el.textContent += '⚠ ' + (e.message||e.type) + '\n' } })
      window.addEventListener('unhandledrejection', e => { const el = document.getElementById('fatal'); if (el) { el.style.display='block'; el.textContent += '⚠ ' + ((e.reason&&e.reason.message)||e.reason) + '\n' } })

      const $ = id => document.getElementById(id)
      const status = s => { $('status').textContent = s }

      // 每次渲染换一个新 canvas：canvas 只能绑定一种 context（webgl 或 2d），
      // live2d↔puppet 切换时旧 context 会占着，必须重建 DOM 节点。
      function freshCanvas() {
        const old = $('stage')
        const c = document.createElement('canvas')
        c.id = 'stage'
        // pixi 的 app.destroy(true) 会把旧 canvas 从 DOM 里摘掉，此时 old 可能为 null
        if (old && old.parentNode) old.parentNode.replaceChild(c, old)
        else document.body.appendChild(c)
        return c
      }

      let teardown = null     // 当前渲染的清理函数
      let speakImpl = null    // (url, text, emotion) => Promise，由渲染层注入
      let unlockImpl = null   // () => void，解锁音频
      let started = false     // 是否已点过「开始直播」

      function done() {
        if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'done' }))
      }

      async function onSpeak(url, text, emotion) {
        $('subtitle').textContent = text || ''
        $('emotion').textContent = emotion ? `[${emotion}]` : ''
        if (speakImpl) await speakImpl(url, text, emotion)
      }

      // ==================== Live2D 渲染 ====================
      async function renderLive2D(model) {
        const canvas = freshCanvas()
        const mod = await import('/vendor/live2d.bundle.mjs')
        const { Application, Ticker, Config, Live2DSprite, Priority, sound } = mod
        Config.MouseFollow = true
        Config.MotionGroupIdle = 'Idle'

        const app = new Application()
        await app.init({
          canvas,
          backgroundAlpha: 0,
          autoDensity: true,
          resolution: Math.max(window.devicePixelRatio || 1, 1),
          preserveDrawingBuffer: true,
        })
        const sprite = new Live2DSprite({
          modelPath: `/Resources/models/${model.id}/${model.model}`,
          ticker: Ticker.shared,
        })
        app.stage.addChild(sprite)
        await sprite.ready

        const mcs = sprite.getModelCanvasSize()
        const zoom = model.zoom != null ? model.zoom : 2.0
        const yBias = model.y != null ? model.y : 0
        function fitModel(z, y) {
          const fit = Math.min(canvas.clientWidth / mcs.width, canvas.clientHeight / mcs.height)
          const scale = fit * z
          sprite.scale.set(scale)
          sprite.position.set((canvas.clientWidth - mcs.width * scale) / 2, y * canvas.clientHeight)
        }
        fitModel(zoom, yBias)
        window.__fitModel = fitModel

        await sprite.startMotion({ group: 'Idle', no: 0, priority: Priority.Normal })

        const NEUTRAL = {
          ParamEyeLSmile: 0, ParamEyeRSmile: 0, ParamCheek: 0,
          ParamBrowLY: 0, ParamBrowRY: 0, ParamBrowLAngle: 0, ParamBrowRAngle: 0,
          ParamMouthForm: 1,
        }
        const EMOTION_PARAMS = {
          开心: { ParamEyeLSmile: 1, ParamEyeRSmile: 1, ParamCheek: 1, ParamMouthForm: 1 },
          惊讶: { ParamBrowLY: 0.9, ParamBrowRY: 0.9, ParamBrowLAngle: 0.6, ParamBrowRAngle: 0.6, ParamMouthForm: 0 },
          卖萌: { ParamEyeLSmile: 1, ParamEyeRSmile: 0.4, ParamCheek: 0.8, ParamBrowLAngle: 0.4, ParamBrowRAngle: 0.4, ParamMouthForm: 1 },
        }
        function setEmotion(emo) {
          const map = { ...NEUTRAL, ...(EMOTION_PARAMS[emo] || {}) }
          for (const [id, v] of Object.entries(map)) {
            const r = sprite.getParameterValueRangeById(id)
            const val = r ? Math.max(r.min, Math.min(r.max, v)) : v
            sprite.setParameterValueById(id, val, 0.4)
          }
        }
        window.__setEmotion = setEmotion

        speakImpl = async (url, text, emotion) => {
          setEmotion(emotion)
          try {
            await sprite.playVoice({ voicePath: url })
          } finally {
            try { URL.revokeObjectURL(url) } catch (e) {}
            setEmotion('平静')
            done()
          }
        }
        unlockImpl = () => {
          try { sound.context?.resume?.() } catch (e) {}
          try { sound.context?.audioContext?.resume?.() } catch (e) {}
        }
        teardown = () => { try { app.destroy(true, { children: true }) } catch (e) {} }

        $('subtitle').textContent = ''
        status(`ready · Live2D · ${model.name}`)
      }

      // ==================== 2D 立绘渲染（puppet） ====================
      async function renderPuppet(model) {
        const face = await (await fetch(`/Resources/models/${model.id}/${model.face}`)).json()
        const CFG = {
          W: face.W, H: face.H,
          faceX: face.face_center_x, anchorY: face.anchor_y,
          eyes: face.eyes, mouth: face.mouth,
          SKIN: face.skin, MOUTH_INNER: face.mouth_inner, TONGUE: face.tongue, LASH: face.lash,
        }
        const canvas = freshCanvas()
        const ctx = canvas.getContext('2d')
        const img = new Image()
        img.src = `/Resources/models/${model.id}/${model.image}`

        const zoom = model.zoom != null ? model.zoom : 1.0
        const yBias = model.y != null ? model.y : 0
        let S = 1, ox = 0, oy = 0, pivotX = 0, pivotY = 0
        function fitModel(z, y) {
          z = z != null ? z : zoom
          y = y != null ? y : yBias
          const dpr = Math.max(window.devicePixelRatio || 1, 1)
          const cw = canvas.clientWidth, ch = canvas.clientHeight
          canvas.width = cw * dpr; canvas.height = ch * dpr
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
          S = (cw / CFG.W) * z
          ox = cw / 2 - CFG.faceX * S
          oy = (0.35 + y) * ch - CFG.anchorY * S
          pivotX = cw / 2
          pivotY = oy + 1450 * S
        }
        window.__fitModel = fitModel

        let squint = 0, mouthMax = 0.7
        let blink = 0
        let nextBlink = performance.now() + 2200
        let mouthOpen = 0
        let speaking = false
        let audioEl = null, audioCtx = null, analyser = null, analyserBuf = null

        function setEmotion(emo) {
          if (emo === '开心') { squint = 0.35; mouthMax = 0.7 }
          else if (emo === '卖萌') { squint = 0.42; mouthMax = 0.65 }
          else if (emo === '惊讶') { squint = 0.0; mouthMax = 1.0 }
          else { squint = 0; mouthMax = 0.7 }
        }
        window.__setEmotion = setEmotion

        function roundRect(x, y, w, h, r) {
          r = Math.min(r, w / 2, h / 2)
          ctx.beginPath()
          ctx.moveTo(x + r, y)
          ctx.arcTo(x + w, y, x + w, y + h, r)
          ctx.arcTo(x + w, y + h, x, y + h, r)
          ctx.arcTo(x, y + h, x, y, r)
          ctx.arcTo(x, y, x + w, y, r)
          ctx.closePath()
        }
        function drawOverlays() {
          for (const e of CFG.eyes) {
            const ex = ox + e.cx * S, ey = oy + e.cy * S
            const ew = e.w * S, eh = e.h * S
            const close = Math.min(1, squint + blink)
            const cover = eh * close
            if (cover < 0.5) continue
            ctx.fillStyle = CFG.SKIN
            roundRect(ex - ew / 2, ey - eh / 2, ew, cover, ew * 0.28)
            ctx.fill()
            ctx.strokeStyle = CFG.LASH
            ctx.lineWidth = Math.max(1, 2.2 * S)
            ctx.beginPath()
            ctx.moveTo(ex - ew / 2, ey - eh / 2 + cover)
            ctx.quadraticCurveTo(ex, ey - eh / 2 + cover - eh * 0.18, ex + ew / 2, ey - eh / 2 + cover)
            ctx.stroke()
          }
          if (mouthOpen > 0.03) {
            const mx = ox + CFG.mouth.cx * S, my = oy + CFG.mouth.cy * S
            const mw = CFG.mouth.w * S * 0.62
            const mh = mw * 0.55 * mouthOpen
            ctx.fillStyle = CFG.MOUTH_INNER
            ctx.beginPath()
            ctx.ellipse(mx, my, mw / 2, Math.max(mh / 2, 1), 0, 0, Math.PI * 2)
            ctx.fill()
            if (mouthOpen > 0.25) {
              ctx.fillStyle = CFG.TONGUE
              ctx.beginPath()
              ctx.ellipse(mx, my + mh * 0.28, mw * 0.34, mh * 0.38, 0, 0, Math.PI * 2)
              ctx.fill()
            }
          }
        }

        let t0 = performance.now()
        let rafId = null
        function tick(now) {
          const t = (now - t0) / 1000
          const breathe = 1 + Math.sin(t * 2 * Math.PI * 0.22) * 0.012
          const sway = Math.sin(t * 2 * Math.PI * 0.11) * 0.012
          const bob = Math.sin(t * 2 * Math.PI * 0.35) * 3.5 * S
          if (now > nextBlink) { blink = 1; nextBlink = now + 2500 + Math.random() * 3500 }
          if (blink > 0) blink = Math.max(0, blink - 0.12)

          if (speaking) {
            let amp = 0.5
            if (analyser && analyserBuf) {
              analyser.getByteTimeDomainData(analyserBuf)
              let s = 0
              for (let i = 0; i < analyserBuf.length; i++) { const v = (analyserBuf[i] - 128) / 128; s += v * v }
              amp = Math.sqrt(s / analyserBuf.length)
            } else {
              amp = 0.4 + 0.3 * Math.sin(t * 2 * Math.PI * 6)
            }
            mouthOpen = Math.min(mouthMax, Math.max(0.05, amp * mouthMax * 1.6))
          } else {
            mouthOpen = 0
          }

          ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight)
          ctx.save()
          ctx.translate(pivotX, pivotY)
          ctx.rotate(sway)
          ctx.scale(breathe, breathe)
          ctx.translate(-pivotX + 0, -pivotY + bob)
          ctx.drawImage(img, ox, oy, CFG.W * S, CFG.H * S)
          drawOverlays()
          ctx.restore()

          rafId = requestAnimationFrame(tick)
        }

        speakImpl = async (url, text, emotion) => {
          setEmotion(emotion)
          speaking = true
          if (!audioEl) {
            audioEl = new Audio()
            audioEl.onended = () => {
              speaking = false
              mouthOpen = 0
              setEmotion('平静')
              try { URL.revokeObjectURL(audioEl.src) } catch (e) {}
              done()
            }
          }
          window.__audio = audioEl
          audioEl.src = url
          audioEl.play().catch(() => {})
          if (!audioCtx && audioEl) {
            try {
              audioCtx = new (window.AudioContext || window.webkitAudioContext)()
              const src = audioCtx.createMediaElementSource(audioEl)
              analyser = audioCtx.createAnalyser()
              analyser.fftSize = 512
              analyserBuf = new Uint8Array(analyser.fftSize)
              src.connect(analyser)
              analyser.connect(audioCtx.destination)
            } catch (e) { analyser = null }
          }
          if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume()
        }
        unlockImpl = () => { try { if (audioCtx) audioCtx.resume() } catch (e) {} }
        teardown = () => { if (rafId) cancelAnimationFrame(rafId) }

        img.onload = () => {
          fitModel()
          $('subtitle').textContent = ''
          status(`ready · 立绘 · ${model.name}`)
          requestAnimationFrame(tick)
        }
      }

      // ==================== 加载当前组合 ====================
      async function renderActive() {
        if (teardown) { try { teardown() } catch (e) {} teardown = null }
        speakImpl = null; unlockImpl = null
        const r = await (await fetch('/api/active')).json()
        const model = r.model, corpus = r.corpus
        status(`模特：${model ? model.name : '无'} · 语料：${corpus ? corpus.name : '无'}`)
        if (!model) return
        if (model.type === 'live2d') await renderLive2D(model)
        else if (model.type === 'puppet') await renderPuppet(model)
        if (started) unlockImpl?.()
      }

      // ==================== WebSocket ====================
      let ws = null, pendingMeta = null
      function connect() {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:'
        ws = new WebSocket(`${proto}//${location.host}/ws`)
        ws.onopen = () => { status('ws 已连接，网页可输入'); $('chatbar').classList.add('show') }
        ws.onclose = () => { status('ws 断开，3s 后重连…'); setTimeout(connect, 3000) }
        ws.onerror = () => ws.close()
        ws.onmessage = ev => {
          if (typeof ev.data === 'string') {
            try {
              const m = JSON.parse(ev.data)
              if (m.type === 'speak') pendingMeta = m
              else if (m.type === 'reload') renderActive()   // 后台切换了模特/语料 → 重渲染
            } catch (e) {}
          } else {
            if (!pendingMeta) return
            const m = pendingMeta; pendingMeta = null
            const blob = ev.data instanceof Blob ? ev.data : new Blob([ev.data], { type: 'audio/mpeg' })
            onSpeak(URL.createObjectURL(blob), m.subtitle, m.emotion)
          }
        }
      }

      function sendComment() {
        const input = $('chat-input'), text = input.value.trim()
        if (!text) return
        if (!ws || ws.readyState !== 1) { status('ws 未连接，无法发送'); return }
        ws.send(JSON.stringify({ type: 'comment', content: text }))
        input.value = ''
        status('已发送：' + text)
      }
      $('chat-send').onclick = sendComment
      $('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendComment() })

      $('boot-overlay').onclick = () => {
        started = true
        $('boot-overlay').style.display = 'none'
        unlockImpl?.()
        connect()
      }

      window.__render = renderActive

      // ==================== 启动 ====================
      await renderActive()
      $('boot-overlay').style.display = 'flex'
    </script>
  </body>
</html>
